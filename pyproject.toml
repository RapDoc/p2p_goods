[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document_quality_evaluation"
version = "0.1.0"
description = "FastAPI microservice for document quality and compliance evaluation"
authors = [ { name = "" } ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.23.0",
    "opencv-python-headless>=4.8.0",
    "easyocr>=1.7.0",
    "PyMuPDF>=1.23.0",
    "numpy>=1.25.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.8.0",
    "openai>=1.0.0"
]

[tool.setuptools]
py-modules = [
    "main",
    "quality_checks",
    "document_quality_schema",
    "schemas",
    "image_utils",
    "text_utils"
]
